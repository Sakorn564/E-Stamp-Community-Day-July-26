<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>WD Journey Stamp Collection</title>

<meta name="theme-color" content="#1c4eb4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f7ff;
}

.header{
  background:#1c4eb4;
  color:white;
  padding:20px;
  text-align:center;
}

.wrap{
  max-width:500px;
  margin:auto;
  padding:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #ddd;
  box-sizing:border-box;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1c4eb4;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#999;
}

#qrScreen{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  z-index:999;
}

#qrVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.frame{
  width:250px;
  height:250px;
  border:4px solid #60a5fa;
  border-radius:20px;
}

.status{
  position:absolute;
  bottom:20px;
  left:20px;
  right:20px;
  background:rgba(0,0,0,.7);
  color:white;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

.success{
  background:#10b981 !important;
}

.progress{
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:16px;
}

.bar{
  height:10px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#1c4eb4;
  width:0%;
  transition:.3s;
}

.complete{
  display:none;
  margin-top:20px;
  background:#10b981;
  color:white;
  padding:20px;
  border-radius:16px;
  text-align:center;
}

</style>
</head>

<body>

<div class="header">
  <h2>WD Journey Stamp Collection</h2>
  <div>สะสมแสตมป์ครบ 4 บูท</div>
</div>

<div class="wrap">

  <input type="text" id="empName" placeholder="ชื่อ-นามสกุล">
  <input type="text" id="empDept" placeholder="แผนก">

  <div class="grid" id="boothGrid"></div>

  <div class="progress">
    <div id="progressText">0 / 4 บูท</div>
    <br>
    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>
  </div>

  <div class="complete" id="completeBox">
    🎉 แสตมป์ครบทั้ง 4 บูทแล้ว
  </div>

</div>

<div id="qrScreen">

  <video
    id="qrVideo"
    autoplay
    playsinline
    muted
  ></video>

  <div class="overlay">
    <div class="frame"></div>
  </div>

  <div class="status" id="status">
    กำลังเปิดกล้อง...
  </div>

</div>

<script>

const SCRIPT_URL = "PASTE_GOOGLE_SCRIPT_URL";

const QR_CODES = {
  customer:"WD-JOURNEY-BOOTH-CUSTOMER",
  result:"WD-JOURNEY-BOOTH-RESULT",
  excellent:"WD-JOURNEY-BOOTH-EXCELLENT",
  innovation:"WD-JOURNEY-BOOTH-INNOVATION"
};

const BOOTHS = [
  {id:"customer",label:"Customer"},
  {id:"result",label:"Result"},
  {id:"excellent",label:"Excellent"},
  {id:"innovation",label:"Innovation"}
];

let stamped = {
  customer:false,
  result:false,
  excellent:false,
  innovation:false
};

let currentBooth = null;
let videoStream = null;
let scanLoop = null;

function buildBooths(){

  const grid = document.getElementById("boothGrid");

  grid.innerHTML = "";

  BOOTHS.forEach(b=>{

    const done = stamped[b.id];

    grid.innerHTML += `
      <div class="card">

        <h3>${b.label}</h3>

        <button
          onclick="openQR('${b.id}')"
          ${done ? "disabled" : ""}
        >
          ${done ? "✓ แสตมป์แล้ว" : "สแกน QR"}
        </button>

      </div>
    `;
  });

  updateProgress();
}

function updateProgress(){

  const total = Object.values(stamped)
    .filter(v=>v).length;

  document.getElementById("progressText")
    .innerText = total + " / 4 บูท";

  document.getElementById("fill")
    .style.width = (total/4*100)+"%";

  if(total===4){

    document.getElementById("completeBox")
      .style.display = "block";

    saveData();
  }
}

async function openQR(id){

  const name = document
    .getElementById("empName")
    .value.trim();

  if(!name){

    alert("กรุณากรอกชื่อ");

    return;
  }

  currentBooth = id;

  document.getElementById("qrScreen")
    .style.display = "block";

  startCamera();
}

async function startCamera(){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){
      alert("Browser ไม่รองรับกล้อง");
      return;
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false
      });

    videoStream = stream;

    const video =
      document.getElementById("qrVideo");

    video.srcObject = stream;

    await video.play();

    setStatus("กำลังสแกน QR...");

    scanQR();

  }catch(err){

    console.error(err);

    alert(
      "เปิดกล้องไม่ได้ กรุณาอนุญาต Camera"
    );
  }
}

function scanQR(){

  const video =
    document.getElementById("qrVideo");

  const canvas =
    document.createElement("canvas");

  const ctx =
    canvas.getContext("2d");

  scanLoop = setInterval(()=>{

    if(video.readyState !== 4) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

    const code = jsQR(
      imageData.data,
      canvas.width,
      canvas.height
    );

    if(code){

      handleQR(code.data);

    }

  },200);
}

function handleQR(data){

  const expected =
    QR_CODES[currentBooth];

  if(data === expected){

    stamped[currentBooth] = true;

    setStatus("สแกนสำเร็จ ✅",true);

    closeQR();

    buildBooths();

  }else{

    setStatus("QR ไม่ถูกต้อง ❌");
  }
}

function closeQR(){

  clearInterval(scanLoop);

  if(videoStream){

    videoStream
      .getTracks()
      .forEach(track=>track.stop());
  }

  document.getElementById("qrScreen")
    .style.display = "none";
}

function setStatus(msg,success=false){

  const status =
    document.getElementById("status");

  status.innerText = msg;

  if(success){

    status.classList.add("success");

  }else{

    status.classList.remove("success");
  }
}

function saveData(){

  const payload = {

    name:
      document.getElementById("empName").value,

    dept:
      document.getElementById("empDept").value,

    customer:stamped.customer,
    result:stamped.result,
    excellent:stamped.excellent,
    innovation:stamped.innovation
  };

  fetch(SCRIPT_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(payload)
  });

  console.log("saved");
}

buildBooths();

</script>

</body>
</html>
